name: DialysisLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  DialysisLog:
    type: application
    platform: iOS
    sources:
      - path: DialysisLog
      - path: Shared
    dependencies:
      - target: DialysisLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dialysis-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: DialysisLog/DialysisLog.entitlements
    info:
      path: DialysisLog/Info.plist
      properties:
        CFBundleDisplayName: Dialysis Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo to attach to a record.
        NSPhotoLibraryUsageDescription: Choose a photo to attach to a record.
        ITSAppUsesNonExemptEncryption: false
  DialysisLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DialysisLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dialysis-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: DialysisLogWidget/DialysisLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: DialysisLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Dialysis Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  DialysisLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DialysisLogTests
    dependencies:
      - target: DialysisLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dialysis-log.tests
        GENERATE_INFOPLIST_FILE: YES
  DialysisLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DialysisLogUITests
    dependencies:
      - target: DialysisLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dialysis-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DialysisLog
schemes:
  DialysisLog:
    build:
      targets:
        DialysisLog: all
        DialysisLogTests: [test]
        DialysisLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: DialysisLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: DialysisLog/StoreKit/Products.storekit
      targets:
        - DialysisLogTests
        - DialysisLogUITests
    archive:
      config: Release
